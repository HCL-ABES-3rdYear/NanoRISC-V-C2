<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440">
<defs>
  <style>
    .bg { fill: #0b1120; }
    .block-pc { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 6; }
    .block-rf { fill: #1e293b; stroke: #818cf8; stroke-width: 2; rx: 6; }
    .block-alu { fill: #1e293b; stroke: #34d399; stroke-width: 2; rx: 6; }
    .block-ctrl { fill: #1e293b; stroke: #f472b6; stroke-width: 2; rx: 6; }
    .block-mem { fill: #1e293b; stroke: #fbbf24; stroke-width: 2; rx: 6; }
    .block-mux { fill: #1e1e38; stroke: #cbd5e1; stroke-width: 1.5; }
    .bus-wire { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
    .ctrl-wire { stroke: #f43f5e; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
    .clk-wire { stroke: #22c55e; stroke-width: 1.8; fill: none; }
    .title { fill: #f8fafc; font-family: -apple-system, sans-serif; font-size: 18px; font-weight: bold; }
    .subtitle { fill: #94a3b8; font-family: monospace; font-size: 12px; }
    .block-header { fill: #f8fafc; font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .port-text { fill: #e2e8f0; font-family: monospace; font-size: 11px; }
    .pin-label { fill: #94a3b8; font-family: monospace; font-size: 10px; }
    .wire-label { fill: #38bdf8; font-family: monospace; font-size: 10px; font-weight: bold; }
    .ctrl-label { fill: #f43f5e; font-family: monospace; font-size: 10px; font-weight: bold; }
    .stage-div { stroke: #e2e8f0; stroke-width: 2; stroke-dasharray: 6,4; }
    .stage-title { fill: #fbbf24; font-family: sans-serif; font-size: 15px; font-weight: bold; }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
  </marker>
  <marker id="ctrl-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
  </marker>
  <marker id="clk-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
  </marker>
</defs>
<rect width="700" height="440" class="bg" rx="10" />
<text x="25" y="32" class="title">Data Memory (data_memory) RTL Schematic</text>
<text x="25" y="52" class="subtitle">NanoRISC-V-C2 Core - 1024x32 RAM with Byte-Lane Masking (SB,SH,SW) &amp; Extension (LB,LH,LW,LBU,LHU)</text>
<rect x="250" y="100" width="220" height="270" class="block-mem" />
<rect x="250" y="100" width="220" height="30" fill="#d97706" rx="6" />
<text x="360" y="122" class="block-header">DMEM RAM Array (1024x32)</text>
<line x1="70" y1="160" x2="250" y2="160" class="bus-wire" marker-end="url(#arrow)" />
<text x="80" y="150" class="wire-label">addr[31:2] (Word Addr) /30</text>
<line x1="70" y1="210" x2="250" y2="210" class="bus-wire" marker-end="url(#arrow)" />
<text x="80" y="200" class="wire-label">write_data[31:0] /32</text>
<line x1="120" y1="260" x2="250" y2="260" class="ctrl-wire" marker-end="url(#ctrl-arrow)" />
<text x="130" y="252" class="ctrl-label">mem_write</text>
<line x1="120" y1="290" x2="250" y2="290" class="ctrl-wire" marker-end="url(#ctrl-arrow)" />
<text x="130" y="282" class="ctrl-label">mem_read</text>
<line x1="140" y1="330" x2="250" y2="330" class="clk-wire" marker-end="url(#clk-arrow)" />
<text x="150" y="322" fill="#22c55e" font-family="monospace" font-size="11">clk</text>
<rect x="270" y="150" width="180" height="90" fill="#0f172a" stroke="#fbbf24" rx="4" />
<text x="360" y="175" fill="#fef3c7" font-size="11" font-weight="bold" text-anchor="middle">Byte-Lane Enable Logic</text>
<text x="360" y="195" fill="#94a3b8" font-size="10" text-anchor="middle">funct3 = SB (8b), SH (16b), SW (32b)</text>
<text x="360" y="215" fill="#94a3b8" font-size="10" text-anchor="middle">Masks ram[word][31:0] lanes</text>
<rect x="520" y="150" width="130" height="110" fill="#1e293b" stroke="#38bdf8" rx="4" />
<text x="585" y="180" class="port-text" text-anchor="middle">Align &amp; Extend</text>
<text x="585" y="200" fill="#94a3b8" font-size="9" text-anchor="middle">LB/LH: Signed</text>
<text x="585" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">LBU/LHU: Zero-ext</text>
<text x="585" y="230" fill="#94a3b8" font-size="9" text-anchor="middle">LW: 32-bit direct</text>
<line x1="470" y1="205" x2="520" y2="205" class="bus-wire" marker-end="url(#arrow)" />
<line x1="650" y1="205" x2="690" y2="205" class="bus-wire" marker-end="url(#arrow)" />
<text x="540" y="140" class="wire-label">read_data[31:0] /32</text>
</svg>