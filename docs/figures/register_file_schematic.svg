<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 460" width="750" height="460">
<defs>
  <style>
    .bg { fill: #0b1120; }
    .block-pc { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 6; }
    .block-rf { fill: #1e293b; stroke: #818cf8; stroke-width: 2; rx: 6; }
    .block-alu { fill: #1e293b; stroke: #34d399; stroke-width: 2; rx: 6; }
    .block-ctrl { fill: #1e293b; stroke: #f472b6; stroke-width: 2; rx: 6; }
    .block-mem { fill: #1e293b; stroke: #fbbf24; stroke-width: 2; rx: 6; }
    .block-mux { fill: #1e1e38; stroke: #cbd5e1; stroke-width: 1.5; }
    .bus-wire { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
    .ctrl-wire { stroke: #f43f5e; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
    .clk-wire { stroke: #22c55e; stroke-width: 1.8; fill: none; }
    .title { fill: #f8fafc; font-family: -apple-system, sans-serif; font-size: 18px; font-weight: bold; }
    .subtitle { fill: #94a3b8; font-family: monospace; font-size: 12px; }
    .block-header { fill: #f8fafc; font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .port-text { fill: #e2e8f0; font-family: monospace; font-size: 11px; }
    .pin-label { fill: #94a3b8; font-family: monospace; font-size: 10px; }
    .wire-label { fill: #38bdf8; font-family: monospace; font-size: 10px; font-weight: bold; }
    .ctrl-label { fill: #f43f5e; font-family: monospace; font-size: 10px; font-weight: bold; }
    .stage-div { stroke: #e2e8f0; stroke-width: 2; stroke-dasharray: 6,4; }
    .stage-title { fill: #fbbf24; font-family: sans-serif; font-size: 15px; font-weight: bold; }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
  </marker>
  <marker id="ctrl-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
  </marker>
  <marker id="clk-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
  </marker>
</defs>
<rect width="750" height="460" class="bg" rx="10" />
<text x="25" y="32" class="title">Register File (register_file) RTL Schematic</text>
<text x="25" y="52" class="subtitle">NanoRISC-V-C2 Core - 32x32-bit Dual Read &amp; Single Write Ports with x0=0 &amp; Internal Bypass</text>
<rect x="250" y="90" width="260" height="320" class="block-rf" />
<rect x="250" y="90" width="260" height="32" fill="#4f46e5" rx="6" />
<text x="380" y="112" class="block-header">RV32I Register File (32 x 32)</text>
<text x="260" y="160" class="port-text">rd_addr[4:0]</text>
<line x1="120" y1="155" x2="250" y2="155" class="bus-wire" marker-end="url(#arrow)" />
<text x="135" y="145" class="wire-label">rd[4:0] /5</text>
<text x="260" y="210" class="port-text">rd_data[31:0]</text>
<line x1="120" y1="205" x2="250" y2="205" class="bus-wire" marker-end="url(#arrow)" />
<text x="135" y="195" class="wire-label">rd_data[31:0] /32</text>
<text x="260" y="260" class="port-text">reg_write_en</text>
<line x1="140" y1="255" x2="250" y2="255" class="ctrl-wire" marker-end="url(#ctrl-arrow)" />
<text x="150" y="247" class="ctrl-label">reg_write</text>
<text x="260" y="310" class="port-text">clk</text>
<line x1="170" y1="305" x2="250" y2="305" class="clk-wire" marker-end="url(#clk-arrow)" />
<text x="400" y="160" class="port-text">rs1_addr[4:0]</text>
<line x1="510" y1="155" x2="570" y2="155" class="bus-wire" marker-end="url(#arrow)" />
<text x="580" y="160" class="wire-label">rs1_data[31:0] /32</text>
<text x="400" y="260" class="port-text">rs2_addr[4:0]</text>
<line x1="510" y1="255" x2="570" y2="255" class="bus-wire" marker-end="url(#arrow)" />
<text x="580" y="260" class="wire-label">rs2_data[31:0] /32</text>
<rect x="270" y="340" width="220" height="50" fill="#0f172a" stroke="#6366f1" rx="4" />
<text x="380" y="360" fill="#a5b4fc" font-size="11" font-weight="bold" text-anchor="middle">x0 Hardwired to 32'h0</text>
<text x="380" y="378" fill="#a5b4fc" font-size="10" text-anchor="middle">Internal Write-Through Bypass</text>
</svg>