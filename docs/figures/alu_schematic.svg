<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440">
<defs>
  <style>
    .bg { fill: #0b1120; }
    .block-pc { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 6; }
    .block-rf { fill: #1e293b; stroke: #818cf8; stroke-width: 2; rx: 6; }
    .block-alu { fill: #1e293b; stroke: #34d399; stroke-width: 2; rx: 6; }
    .block-ctrl { fill: #1e293b; stroke: #f472b6; stroke-width: 2; rx: 6; }
    .block-mem { fill: #1e293b; stroke: #fbbf24; stroke-width: 2; rx: 6; }
    .block-mux { fill: #1e1e38; stroke: #cbd5e1; stroke-width: 1.5; }
    .bus-wire { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
    .ctrl-wire { stroke: #f43f5e; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
    .clk-wire { stroke: #22c55e; stroke-width: 1.8; fill: none; }
    .title { fill: #f8fafc; font-family: -apple-system, sans-serif; font-size: 18px; font-weight: bold; }
    .subtitle { fill: #94a3b8; font-family: monospace; font-size: 12px; }
    .block-header { fill: #f8fafc; font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .port-text { fill: #e2e8f0; font-family: monospace; font-size: 11px; }
    .pin-label { fill: #94a3b8; font-family: monospace; font-size: 10px; }
    .wire-label { fill: #38bdf8; font-family: monospace; font-size: 10px; font-weight: bold; }
    .ctrl-label { fill: #f43f5e; font-family: monospace; font-size: 10px; font-weight: bold; }
    .stage-div { stroke: #e2e8f0; stroke-width: 2; stroke-dasharray: 6,4; }
    .stage-title { fill: #fbbf24; font-family: sans-serif; font-size: 15px; font-weight: bold; }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
  </marker>
  <marker id="ctrl-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
  </marker>
  <marker id="clk-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
  </marker>
</defs>
<rect width="700" height="440" class="bg" rx="10" />
<text x="25" y="32" class="title">Arithmetic Logic Unit (alu) RTL Schematic</text>
<text x="25" y="52" class="subtitle">NanoRISC-V-C2 Core - 11 Operations: ADD, SUB, Shifts, Logical, Comparisons, PASS_B</text>
<polygon points="260,110 380,150 380,290 260,330 260,240 280,220 260,200" class="block-alu" />
<text x="320" y="225" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">ALU</text>
<line x1="120" y1="160" x2="260" y2="160" class="bus-wire" marker-end="url(#arrow)" />
<text x="140" y="150" class="wire-label">a[31:0] (rs1 / PC) /32</text>
<text x="270" y="165" class="port-text">A</text>
<line x1="120" y1="280" x2="260" y2="280" class="bus-wire" marker-end="url(#arrow)" />
<text x="140" y="270" class="wire-label">b[31:0] (rs2 / Imm) /32</text>
<text x="270" y="285" class="port-text">B</text>
<line x1="320" y1="70" x2="320" y2="130" class="ctrl-wire" marker-end="url(#ctrl-arrow)" />
<text x="330" y="90" class="ctrl-label">alu_ctrl[3:0] /4</text>
<line x1="380" y1="220" x2="540" y2="220" class="bus-wire" marker-end="url(#arrow)" />
<text x="400" y="210" class="wire-label">result[31:0] /32</text>
<rect x="420" y="260" width="80" height="40" fill="#1e293b" stroke="#34d399" rx="4" />
<text x="460" y="285" fill="#f8fafc" font-size="11" text-anchor="middle">Zero Detect</text>
<line x1="410" y1="220" x2="410" y2="280" class="bus-wire" />
<line x1="410" y1="280" x2="420" y2="280" class="bus-wire" marker-end="url(#arrow)" />
<circle cx="410" cy="220" r="3" fill="#38bdf8" />
<line x1="500" y1="280" x2="570" y2="280" class="ctrl-wire" marker-end="url(#ctrl-arrow)" />
<text x="510" y="272" class="ctrl-label">zero flag</text>
<rect x="120" y="360" width="460" height="50" fill="#0f172a" stroke="#10b981" rx="4" />
<text x="350" y="380" fill="#6ee7b7" font-size="11" font-weight="bold" text-anchor="middle">Supports: ADD, SUB, SLL, SLT, SLTU, XOR, SRL, SRA, OR, AND, PASS_B</text>
<text x="350" y="398" fill="#94a3b8" font-size="10" text-anchor="middle">Standard RV32I 32-bit Integer Execution Units</text>
</svg>