<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
<defs>
  <style>
    .canvas { fill: #0a0f1d; }
    .header-box { fill: #111827; stroke: #3b82f6; stroke-width: 2; rx: 8; }
    .main-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; text-anchor: middle; }
    .stage-box-if { fill: #0b192c; stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 6,4; rx: 12; }
    .stage-box-ex { fill: #13112c; stroke: #a855f7; stroke-width: 2; stroke-dasharray: 6,4; rx: 12; }
    .stage-hdr-if { fill: #38bdf8; font-family: sans-serif; font-size: 16px; font-weight: 800; text-anchor: middle; }
    .stage-hdr-ex { fill: #c084fc; font-family: sans-serif; font-size: 16px; font-weight: 800; text-anchor: middle; }
    .mod-fetch { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
    .mod-pipe  { fill: #0284c7; stroke: #bae6fd; stroke-width: 2.5; rx: 8; }
    .mod-ctrl  { fill: #2d122d; stroke: #f43f5e; stroke-width: 2; rx: 8; }
    .mod-rf    { fill: #1e1b4b; stroke: #818cf8; stroke-width: 2; rx: 8; }
    .mod-alu   { fill: #064e3b; stroke: #34d399; stroke-width: 2; rx: 8; }
    .mod-mem   { fill: #3b2803; stroke: #fbbf24; stroke-width: 2; rx: 8; }
    .mod-wb    { fill: #450a0a; stroke: #f87171; stroke-width: 2; rx: 8; }
    .mod-mux   { fill: #1e293b; stroke: #94a3b8; stroke-width: 1.5; }
    .title-text { fill: #ffffff; font-family: sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .sub-text   { fill: #94a3b8; font-family: monospace; font-size: 10px; text-anchor: middle; }
    .bus-line   { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
    .ctrl-line  { stroke: #f43f5e; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
    .clk-line   { stroke: #22c55e; stroke-width: 1.8; fill: none; }
    .wire-lbl   { fill: #7dd3fc; font-family: monospace; font-size: 10px; font-weight: 600; }
    .ctrl-lbl   { fill: #f43f5e; font-family: monospace; font-size: 10px; font-weight: 600; }
    .card-box   { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 8; }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
  </marker>
  <marker id="ctrl-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
  </marker>
</defs>
<rect width="1200" height="680" class="canvas" rx="14" />
<rect x="250" y="18" width="700" height="46" class="header-box" />
<text x="600" y="48" class="main-title">NanoRISC-V C2 — 2-Stage Processor Architecture Block Diagram</text>
<rect x="30" y="80" width="370" height="430" class="stage-box-if" />
<text x="215" y="112" class="stage-hdr-if">Stage 1: Instruction Fetch (IF)</text>
<polygon points="55,210 80,225 80,295 55,310" class="mod-mux" />
<text x="65" y="265" fill="#f8fafc" font-size="10" font-weight="bold">MUX</text>
<rect x="115" y="220" width="95" height="80" class="mod-fetch" />
<text x="162" y="255" class="title-text">PC Register</text>
<text x="162" y="272" class="sub-text">(program_counter)</text>
<line x1="80" y1="260" x2="115" y2="260" class="bus-line" marker-end="url(#arrow)" />
<text x="82" y="252" class="wire-lbl">pc_next</text>
<polygon points="120,135 155,150 155,190 120,205" class="mod-mux" />
<text x="133" y="174" fill="#f8fafc" font-size="11" font-weight="bold">+4</text>
<line x1="210" y1="260" x2="245" y2="260" class="bus-line" marker-end="url(#arrow)" />
<circle cx="225" cy="260" r="3.5" fill="#38bdf8" />
<line x1="225" y1="260" x2="225" y2="170" class="bus-line" />
<line x1="225" y1="170" x2="155" y2="170" class="bus-line" marker-end="url(#arrow)" />
<line x1="120" y1="170" x2="40" y2="170" class="bus-line" />
<line x1="40" y1="170" x2="40" y2="235" class="bus-line" />
<line x1="40" y1="235" x2="55" y2="235" class="bus-line" marker-end="url(#arrow)" />
<text x="45" y="162" class="wire-lbl">pc+4 /32</text>
<rect x="245" y="215" width="135" height="90" class="mod-fetch" />
<text x="312" y="252" class="title-text">Instruction Memory</text>
<text x="312" y="268" class="sub-text">(instruction_memory.v)</text>
<text x="312" y="284" fill="#38bdf8" font-size="9" text-anchor="middle">1024x32 ROM / Asynch</text>
<line x1="162" y1="340" x2="162" y2="300" class="clk-line" />
<text x="150" y="355" fill="#22c55e" font-size="10" font-weight="bold">clk</text>
<line x1="185" y1="340" x2="185" y2="300" class="ctrl-line" marker-end="url(#ctrl-arr)" />
<text x="175" y="355" class="ctrl-lbl">rst</text>
<rect x="420" y="150" width="46" height="290" class="mod-pipe" />
<text x="443" y="295" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 443 295)">IF / ID PIPELINE REGISTER</text>
<line x1="225" y1="260" x2="225" y2="200" class="bus-line" />
<line x1="225" y1="200" x2="420" y2="200" class="bus-line" marker-end="url(#arrow)" />
<text x="330" y="192" class="wire-lbl">pc_if [31:0] /32</text>
<line x1="380" y1="260" x2="420" y2="260" class="bus-line" marker-end="url(#arrow)" />
<text x="382" y="252" class="wire-lbl">inst_if /32</text>
<line x1="443" y1="480" x2="443" y2="440" class="ctrl-line" marker-end="url(#ctrl-arr)" />
<text x="410" y="495" class="ctrl-lbl">FLUSH (to NOP)</text>
<rect x="485" y="80" width="685" height="430" class="stage-box-ex" />
<text x="825" y="112" class="stage-hdr-ex">Stage 2: Decode / Execute / Memory / Writeback (ID/EX/MEM/WB)</text>
<line x1="466" y1="200" x2="520" y2="200" class="bus-line" marker-end="url(#arrow)" />
<text x="472" y="192" class="wire-lbl">pc_id</text>
<line x1="466" y1="260" x2="505" y2="260" class="bus-line" />
<circle cx="505" cy="260" r="3.5" fill="#38bdf8" />
<rect x="520" y="130" width="135" height="75" class="mod-ctrl" />
<text x="587" y="160" class="title-text">Control Unit</text>
<text x="587" y="176" class="sub-text">(control_unit.v)</text>
<text x="587" y="192" fill="#f43f5e" font-size="9" text-anchor="middle">Main Opcode Decoder</text>
<line x1="505" y1="260" x2="505" y2="167" class="bus-line" />
<line x1="505" y1="167" x2="520" y2="167" class="bus-line" marker-end="url(#arrow)" />
<rect x="520" y="225" width="135" height="70" class="mod-ctrl" />
<text x="587" y="255" class="title-text">Immediate Gen</text>
<text x="587" y="271" class="sub-text">(imm_gen logic)</text>
<text x="587" y="285" fill="#fb7185" font-size="9" text-anchor="middle">I, S, B, U, J Slicing</text>
<line x1="505" y1="260" x2="520" y2="260" class="bus-line" marker-end="url(#arrow)" />
<rect x="520" y="315" width="135" height="95" class="mod-rf" />
<text x="587" y="347" class="title-text">Register File</text>
<text x="587" y="363" class="sub-text">(register_file.v)</text>
<text x="587" y="379" fill="#a5b4fc" font-size="9" text-anchor="middle">32 x 32-bit (x0=0)</text>
<text x="587" y="393" fill="#818cf8" font-size="8" text-anchor="middle">Dual Read + Write Bypass</text>
<line x1="505" y1="260" x2="505" y2="350" class="bus-line" />
<line x1="505" y1="350" x2="520" y2="350" class="bus-line" marker-end="url(#arrow)" />
<polygon points="690,195 710,205 710,245 690,255" class="mod-mux" />
<text x="696" y="228" fill="#f8fafc" font-size="9">MUX</text>
<line x1="655" y1="335" x2="675" y2="335" class="bus-line" />
<line x1="675" y1="335" x2="675" y2="215" class="bus-line" />
<line x1="675" y1="215" x2="690" y2="215" class="bus-line" marker-end="url(#arrow)" />
<text x="660" y="325" class="wire-lbl">rs1</text>
<polygon points="690,270 710,280 710,320 690,330" class="mod-mux" />
<text x="696" y="303" fill="#f8fafc" font-size="9">MUX</text>
<line x1="655" y1="380" x2="680" y2="380" class="bus-line" />
<line x1="680" y1="380" x2="680" y2="290" class="bus-line" />
<line x1="680" y1="290" x2="690" y2="290" class="bus-line" marker-end="url(#arrow)" />
<text x="660" y="372" class="wire-lbl">rs2</text>
<line x1="655" y1="260" x2="670" y2="260" class="bus-line" />
<line x1="670" y1="260" x2="670" y2="310" class="bus-line" />
<line x1="670" y1="310" x2="690" y2="310" class="bus-line" marker-end="url(#arrow)" />
<text x="652" y="252" class="wire-lbl">imm /32</text>
<polygon points="740,195 820,230 820,310 740,345 740,285 755,270 740,255" class="mod-alu" />
<text x="780" y="275" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">ALU</text>
<text x="780" y="292" fill="#6ee7b7" font-size="9" text-anchor="middle">(alu.v)</text>
<line x1="710" y1="225" x2="740" y2="225" class="bus-line" marker-end="url(#arrow)" />
<line x1="710" y1="300" x2="740" y2="300" class="bus-line" marker-end="url(#arrow)" />
<line x1="655" y1="167" x2="780" y2="167" class="ctrl-line" />
<line x1="780" y1="167" x2="780" y2="210" class="ctrl-line" marker-end="url(#ctrl-arr)" />
<text x="700" y="160" class="ctrl-lbl">alu_ctrl [3:0]</text>
<rect x="865" y="225" width="125" height="95" class="mod-mem" />
<text x="927" y="258" class="title-text">Data Memory</text>
<text x="927" y="274" class="sub-text">(data_memory.v)</text>
<text x="927" y="290" fill="#fbbf24" font-size="9" text-anchor="middle">1024x32 RAM</text>
<text x="927" y="304" fill="#fef08a" font-size="8" text-anchor="middle">Byte / Half / Word</text>
<line x1="820" y1="270" x2="865" y2="270" class="bus-line" marker-end="url(#arrow)" />
<circle cx="842" cy="270" r="3.5" fill="#38bdf8" />
<text x="825" y="260" class="wire-lbl">addr</text>
<line x1="680" y1="380" x2="850" y2="380" class="bus-line" />
<line x1="850" y1="380" x2="850" y2="295" class="bus-line" />
<line x1="850" y1="295" x2="865" y2="295" class="bus-line" marker-end="url(#arrow)" />
<text x="760" y="392" class="wire-lbl">write_data (rs2) /32</text>
<polygon points="1025,230 1055,245 1055,325 1025,340" class="mod-wb" />
<text x="1035" y="285" fill="#f8fafc" font-size="10" font-weight="bold">WB MUX</text>
<line x1="842" y1="270" x2="842" y2="350" class="bus-line" />
<line x1="842" y1="350" x2="1010" y2="350" class="bus-line" />
<line x1="1010" y1="350" x2="1010" y2="290" class="bus-line" />
<line x1="1010" y1="290" x2="1025" y2="290" class="bus-line" marker-end="url(#arrow)" />
<line x1="990" y1="270" x2="1025" y2="270" class="bus-line" marker-end="url(#arrow)" />
<text x="992" y="262" class="wire-lbl">read_data</text>
<line x1="1055" y1="285" x2="1090" y2="285" class="bus-line" />
<line x1="1090" y1="285" x2="1090" y2="445" class="bus-line" />
<line x1="1090" y1="445" x2="500" y2="445" class="bus-line" />
<line x1="500" y1="445" x2="500" y2="385" class="bus-line" />
<line x1="500" y1="385" x2="520" y2="385" class="bus-line" marker-end="url(#arrow)" />
<text x="750" y="440" class="wire-lbl">Writeback rd_data [31:0] /32</text>
<line x1="575" y1="205" x2="575" y2="315" class="ctrl-line" marker-end="url(#ctrl-arr)" />
<text x="580" y="215" class="ctrl-lbl">reg_write</text>
<rect x="670" y="440" width="180" height="55" class="mod-ctrl" />
<text x="760" y="465" class="title-text">Next PC &amp; Branch Logic</text>
<text x="760" y="482" fill="#fb7185" font-size="9" text-anchor="middle">BEQ, BNE, BLT, BGE, JAL, JALR</text>
<line x1="670" y1="470" x2="68" y2="470" class="ctrl-line" />
<line x1="68" y1="470" x2="68" y2="310" class="ctrl-line" marker-end="url(#ctrl-arr)" />
<text x="260" y="462" class="ctrl-lbl">pc_src (Branch Condition Met / Jump)</text>
<line x1="760" y1="495" x2="760" y2="505" class="bus-line" />
<line x1="760" y1="505" x2="35" y2="505" class="bus-line" />
<line x1="35" y1="505" x2="35" y2="280" class="bus-line" />
<line x1="35" y1="280" x2="55" y2="280" class="bus-line" marker-end="url(#arrow)" />
<text x="210" y="520" class="wire-lbl">branch_jump_target [31:0] /32</text>
<rect x="30" y="535" width="600" height="120" class="card-box" />
<text x="45" y="560" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Color Palette Legend:</text>
<rect x="45" y="575" width="22" height="16" class="mod-fetch" />
<text x="77" y="587" fill="#cbd5e1" font-family="sans-serif" font-size="11">Fetch Components (PC, IMEM)</text>
<rect x="45" y="605" width="22" height="16" class="mod-pipe" />
<text x="77" y="617" fill="#cbd5e1" font-family="sans-serif" font-size="11">Pipeline Barrier (IF/ID)</text>
<rect x="45" y="635" width="22" height="16" class="mod-ctrl" />
<text x="77" y="647" fill="#cbd5e1" font-family="sans-serif" font-size="11">Decode &amp; Branch Control</text>
<rect x="320" y="575" width="22" height="16" class="mod-rf" />
<text x="352" y="587" fill="#cbd5e1" font-family="sans-serif" font-size="11">Register File (32x32, x0=0)</text>
<rect x="320" y="605" width="22" height="16" class="mod-alu" />
<text x="352" y="617" fill="#cbd5e1" font-family="sans-serif" font-size="11">Execution Unit (11-Op ALU)</text>
<rect x="320" y="635" width="22" height="16" class="mod-mem" />
<text x="352" y="647" fill="#cbd5e1" font-family="sans-serif" font-size="11">Data Memory &amp; WB Multiplexer</text>
<rect x="650" y="535" width="520" height="120" class="card-box" />
<text x="665" y="560" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Key Architectural Properties:</text>
<text x="665" y="582" fill="#e2e8f0" font-family="sans-serif" font-size="11">&#8226; 2-Stage Pipeline: Consolidates Decode, Execute, Memory &amp; Writeback in Stage 2</text>
<text x="665" y="602" fill="#e2e8f0" font-family="sans-serif" font-size="11">&#8226; Zero RAW Hazard Stalls: Linear instructions achieve deterministic 1.0 CPI</text>
<text x="665" y="622" fill="#e2e8f0" font-family="sans-serif" font-size="11">&#8226; Single-Cycle Flush Penalty: Taken branches squash speculative Stage 1 fetch</text>
<text x="665" y="642" fill="#e2e8f0" font-family="sans-serif" font-size="11">&#8226; Pure Standard Verilog-2001: Zero vendor-specific primitives, 100% portable</text>
</svg>