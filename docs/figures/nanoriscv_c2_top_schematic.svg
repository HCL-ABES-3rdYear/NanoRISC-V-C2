<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680">
<defs>
  <style>
    .bg { fill: #0b1120; }
    .block-pc { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 6; }
    .block-rf { fill: #1e293b; stroke: #818cf8; stroke-width: 2; rx: 6; }
    .block-alu { fill: #1e293b; stroke: #34d399; stroke-width: 2; rx: 6; }
    .block-ctrl { fill: #1e293b; stroke: #f472b6; stroke-width: 2; rx: 6; }
    .block-mem { fill: #1e293b; stroke: #fbbf24; stroke-width: 2; rx: 6; }
    .block-mux { fill: #1e1e38; stroke: #cbd5e1; stroke-width: 1.5; }
    .bus-wire { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
    .ctrl-wire { stroke: #f43f5e; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
    .clk-wire { stroke: #22c55e; stroke-width: 1.8; fill: none; }
    .title { fill: #f8fafc; font-family: -apple-system, sans-serif; font-size: 18px; font-weight: bold; }
    .subtitle { fill: #94a3b8; font-family: monospace; font-size: 12px; }
    .block-header { fill: #f8fafc; font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .port-text { fill: #e2e8f0; font-family: monospace; font-size: 11px; }
    .pin-label { fill: #94a3b8; font-family: monospace; font-size: 10px; }
    .wire-label { fill: #38bdf8; font-family: monospace; font-size: 10px; font-weight: bold; }
    .ctrl-label { fill: #f43f5e; font-family: monospace; font-size: 10px; font-weight: bold; }
    .stage-div { stroke: #e2e8f0; stroke-width: 2; stroke-dasharray: 6,4; }
    .stage-title { fill: #fbbf24; font-family: sans-serif; font-size: 15px; font-weight: bold; }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
  </marker>
  <marker id="ctrl-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
  </marker>
  <marker id="clk-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
  </marker>
</defs>
<rect width="1100" height="680" class="bg" rx="10" />
<text x="25" y="32" class="title">NanoRISC-V-C2 Top-Level Complete Core RTL Schematic</text>
<text x="25" y="52" class="subtitle">2-Stage RV32I Processor: Fetch (Stage 1) &amp; Execute/Decode/Memory/Writeback (Stage 2) with Synchronous Flush</text>
<line x1="330" y1="75" x2="330" y2="660" class="stage-div" />
<text x="130" y="95" class="stage-title">STAGE 1: INSTRUCTION FETCH (IF)</text>
<text x="540" y="95" class="stage-title">STAGE 2: DECODE / EXECUTE / MEMORY / WRITEBACK (ID/EX/MEM/WB)</text>
<polygon points="40,240 65,255 65,315 40,330" class="block-mux" />
<text x="47" y="290" fill="#f8fafc" font-size="10">MUX</text>
<polygon points="90,140 130,155 130,195 90,210" class="block-mux" />
<text x="98" y="180" fill="#f8fafc" font-size="11">+4</text>
<line x1="130" y1="175" x2="160" y2="175" class="bus-wire" />
<line x1="160" y1="175" x2="160" y2="120" class="bus-wire" />
<line x1="160" y1="120" x2="20" y2="120" class="bus-wire" />
<line x1="20" y1="120" x2="20" y2="260" class="bus-wire" />
<line x1="20" y1="260" x2="40" y2="260" class="bus-wire" marker-end="url(#arrow)" />
<text x="50" y="112" class="wire-label">pc_plus_4</text>
<rect x="90" y="250" width="70" height="70" class="block-pc" />
<text x="125" y="285" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">PC</text>
<line x1="65" y1="285" x2="90" y2="285" class="bus-wire" marker-end="url(#arrow)" />
<line x1="160" y1="285" x2="190" y2="285" class="bus-wire" marker-end="url(#arrow)" />
<circle cx="175" cy="285" r="3" fill="#38bdf8" />
<line x1="175" y1="285" x2="175" y2="175" class="bus-wire" />
<line x1="175" y1="175" x2="130" y2="175" class="bus-wire" marker-end="url(#arrow)" />
<rect x="190" y="235" width="100" height="100" class="block-mem" />
<text x="240" y="280" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">IMEM</text>
<text x="240" y="298" fill="#94a3b8" font-size="10" text-anchor="middle">1024x32</text>
<rect x="315" y="160" width="30" height="360" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="4" />
<text x="330" y="340" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" transform="rotate(-90 330 340)">PIPELINE REG (IF/ID)</text>
<line x1="175" y1="285" x2="315" y2="200" class="bus-wire" marker-end="url(#arrow)" />
<line x1="290" y1="285" x2="315" y2="285" class="bus-wire" marker-end="url(#arrow)" />
<line x1="345" y1="200" x2="410" y2="200" class="bus-wire" marker-end="url(#arrow)" />
<text x="350" y="192" class="wire-label">pc_id</text>
<line x1="345" y1="285" x2="380" y2="285" class="bus-wire" marker-end="url(#arrow)" />
<text x="350" y="278" class="wire-label">inst_id</text>
<rect x="380" y="360" width="130" height="150" class="block-ctrl" />
<text x="445" y="420" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Control Unit</text>
<text x="445" y="438" fill="#fbcfe8" font-size="10" text-anchor="middle">&amp; Imm Gen</text>
<line x1="365" y1="285" x2="365" y2="430" class="bus-wire" />
<line x1="365" y1="430" x2="380" y2="430" class="bus-wire" marker-end="url(#arrow)" />
<circle cx="365" cy="285" r="3" fill="#38bdf8" />
<rect x="420" y="170" width="120" height="160" class="block-rf" />
<text x="480" y="235" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Register File</text>
<text x="480" y="252" fill="#a5b4fc" font-size="10" text-anchor="middle">32x32 (x0=0)</text>
<line x1="380" y1="230" x2="420" y2="230" class="bus-wire" marker-end="url(#arrow)" />
<text x="382" y="222" class="wire-label">rs1</text>
<line x1="380" y1="260" x2="420" y2="260" class="bus-wire" marker-end="url(#arrow)" />
<text x="382" y="252" class="wire-label">rs2</text>
<polygon points="575,190 595,200 595,240 575,250" class="block-mux" />
<line x1="540" y1="210" x2="575" y2="210" class="bus-wire" marker-end="url(#arrow)" />
<polygon points="575,260 595,270 595,310 575,320" class="block-mux" />
<line x1="540" y1="280" x2="575" y2="280" class="bus-wire" marker-end="url(#arrow)" />
<line x1="510" y1="460" x2="560" y2="460" class="bus-wire" />
<line x1="560" y1="460" x2="560" y2="300" class="bus-wire" />
<line x1="560" y1="300" x2="575" y2="300" class="bus-wire" marker-end="url(#arrow)" />
<text x="525" y="450" class="wire-label">imm[31:0]</text>
<polygon points="630,190 710,225 710,315 630,350 630,285 645,270 630,255" class="block-alu" />
<text x="670" y="275" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">ALU</text>
<line x1="595" y1="220" x2="630" y2="220" class="bus-wire" marker-end="url(#arrow)" />
<line x1="595" y1="290" x2="630" y2="290" class="bus-wire" marker-end="url(#arrow)" />
<rect x="760" y="220" width="110" height="140" class="block-mem" />
<text x="815" y="280" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Data Memory</text>
<text x="815" y="298" fill="#fef3c7" font-size="10" text-anchor="middle">1024x32 RAM</text>
<line x1="710" y1="270" x2="760" y2="270" class="bus-wire" marker-end="url(#arrow)" />
<circle cx="735" cy="270" r="3" fill="#38bdf8" />
<polygon points="910,220 940,240 940,320 910,340" class="block-mux" />
<text x="918" y="285" fill="#f8fafc" font-size="10">WB MUX</text>
<line x1="870" y1="260" x2="910" y2="260" class="bus-wire" marker-end="url(#arrow)" />
<line x1="735" y1="270" x2="735" y2="380" class="bus-wire" />
<line x1="735" y1="380" x2="890" y2="380" class="bus-wire" />
<line x1="890" y1="380" x2="890" y2="290" class="bus-wire" />
<line x1="890" y1="290" x2="910" y2="290" class="bus-wire" marker-end="url(#arrow)" />
<line x1="940" y1="280" x2="980" y2="280" class="bus-wire" />
<line x1="980" y1="280" x2="980" y2="580" class="bus-wire" />
<line x1="980" y1="580" x2="400" y2="580" class="bus-wire" />
<line x1="400" y1="580" x2="400" y2="300" class="bus-wire" />
<line x1="400" y1="300" x2="420" y2="300" class="bus-wire" marker-end="url(#arrow)" />
<text x="640" y="570" class="wire-label">Writeback rd_data[31:0] /32</text>
<line x1="510" y1="380" x2="510" y2="360" class="ctrl-wire" />
<line x1="480" y1="510" x2="480" y2="540" class="ctrl-wire" />
<line x1="480" y1="540" x2="50" y2="540" class="ctrl-wire" />
<line x1="50" y1="540" x2="50" y2="330" class="ctrl-wire" marker-end="url(#ctrl-arrow)" />
<text x="210" y="532" class="ctrl-label">pc_src (Branch Taken / Jump)</text>
<circle cx="330" cy="540" r="4" fill="#f43f5e" />
<line x1="330" y1="540" x2="330" y2="520" class="ctrl-wire" marker-end="url(#ctrl-arrow)" />
<text x="338" y="525" class="ctrl-label">FLUSH (to NOP)</text>
<line x1="680" y1="480" x2="30" y2="480" class="bus-wire" />
<line x1="30" y1="480" x2="30" y2="300" class="bus-wire" />
<line x1="30" y1="300" x2="40" y2="300" class="bus-wire" marker-end="url(#arrow)" />
<text x="140" y="472" class="wire-label">branch_jump_target[31:0] /32</text>
</svg>