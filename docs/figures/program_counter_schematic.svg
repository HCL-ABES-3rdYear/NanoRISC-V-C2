<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="650" height="420">
<defs>
  <style>
    .bg { fill: #0b1120; }
    .block-pc { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 6; }
    .block-rf { fill: #1e293b; stroke: #818cf8; stroke-width: 2; rx: 6; }
    .block-alu { fill: #1e293b; stroke: #34d399; stroke-width: 2; rx: 6; }
    .block-ctrl { fill: #1e293b; stroke: #f472b6; stroke-width: 2; rx: 6; }
    .block-mem { fill: #1e293b; stroke: #fbbf24; stroke-width: 2; rx: 6; }
    .block-mux { fill: #1e1e38; stroke: #cbd5e1; stroke-width: 1.5; }
    .bus-wire { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
    .ctrl-wire { stroke: #f43f5e; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
    .clk-wire { stroke: #22c55e; stroke-width: 1.8; fill: none; }
    .title { fill: #f8fafc; font-family: -apple-system, sans-serif; font-size: 18px; font-weight: bold; }
    .subtitle { fill: #94a3b8; font-family: monospace; font-size: 12px; }
    .block-header { fill: #f8fafc; font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .port-text { fill: #e2e8f0; font-family: monospace; font-size: 11px; }
    .pin-label { fill: #94a3b8; font-family: monospace; font-size: 10px; }
    .wire-label { fill: #38bdf8; font-family: monospace; font-size: 10px; font-weight: bold; }
    .ctrl-label { fill: #f43f5e; font-family: monospace; font-size: 10px; font-weight: bold; }
    .stage-div { stroke: #e2e8f0; stroke-width: 2; stroke-dasharray: 6,4; }
    .stage-title { fill: #fbbf24; font-family: sans-serif; font-size: 15px; font-weight: bold; }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
  </marker>
  <marker id="ctrl-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
  </marker>
  <marker id="clk-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
  </marker>
</defs>
<rect width="650" height="420" class="bg" rx="10" />
<text x="25" y="32" class="title">Program Counter (program_counter) RTL Schematic</text>
<text x="25" y="52" class="subtitle">NanoRISC-V-C2 Core - 32-bit Synchronous Fetch Address Register</text>
<polygon points="140,160 170,180 170,240 140,260" class="block-mux" />
<text x="150" y="215" fill="#f8fafc" font-size="11" font-weight="bold">MUX</text>
<text x="120" y="185" class="port-text">pc_next</text>
<text x="120" y="245" class="port-text">pc_curr</text>
<line x1="70" y1="180" x2="140" y2="180" class="bus-wire" marker-end="url(#arrow)" />
<text x="80" y="172" class="wire-label">pc_next[31:0] /32</text>
<line x1="155" y1="120" x2="155" y2="170" class="ctrl-wire" marker-end="url(#ctrl-arrow)" />
<text x="135" y="112" class="ctrl-label">stall</text>
<line x1="170" y1="210" x2="260" y2="210" class="bus-wire" marker-end="url(#arrow)" />
<text x="180" y="202" class="wire-label">d_in[31:0] /32</text>
<rect x="260" y="140" width="180" height="150" class="block-pc" />
<rect x="260" y="140" width="180" height="28" fill="#0284c7" rx="6" />
<text x="350" y="160" class="block-header">PC Register (32-bit)</text>
<text x="275" y="200" class="port-text">D[31:0]</text>
<text x="400" y="200" class="port-text">Q[31:0]</text>
<text x="275" y="260" class="port-text">CLK</text>
<polygon points="260,250 270,255 260,260" fill="none" stroke="#22c55e" stroke-width="2" />
<text x="350" y="278" class="ctrl-label">RST (Sync)</text>
<line x1="440" y1="200" x2="570" y2="200" class="bus-wire" marker-end="url(#arrow)" />
<text x="460" y="190" class="wire-label">pc[31:0] /32</text>
<line x1="510" y1="200" x2="510" y2="330" class="bus-wire" />
<line x1="510" y1="330" x2="110" y2="330" class="bus-wire" />
<line x1="110" y1="330" x2="110" y2="240" class="bus-wire" />
<line x1="110" y1="240" x2="140" y2="240" class="bus-wire" marker-end="url(#arrow)" />
<circle cx="510" cy="200" r="4" fill="#38bdf8" />
<line x1="180" y1="255" x2="260" y2="255" class="clk-wire" marker-end="url(#clk-arrow)" />
<text x="195" y="247" fill="#22c55e" font-family="monospace" font-size="11" font-weight="bold">clk</text>
<line x1="350" y1="330" x2="350" y2="290" class="ctrl-wire" marker-end="url(#ctrl-arrow)" />
<text x="360" y="320" class="ctrl-label">rst</text>
</svg>