<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
<defs>
  <style>
    .bg { fill: #0b1120; }
    .block-pc { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 6; }
    .block-rf { fill: #1e293b; stroke: #818cf8; stroke-width: 2; rx: 6; }
    .block-alu { fill: #1e293b; stroke: #34d399; stroke-width: 2; rx: 6; }
    .block-ctrl { fill: #1e293b; stroke: #f472b6; stroke-width: 2; rx: 6; }
    .block-mem { fill: #1e293b; stroke: #fbbf24; stroke-width: 2; rx: 6; }
    .block-mux { fill: #1e1e38; stroke: #cbd5e1; stroke-width: 1.5; }
    .bus-wire { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
    .ctrl-wire { stroke: #f43f5e; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
    .clk-wire { stroke: #22c55e; stroke-width: 1.8; fill: none; }
    .title { fill: #f8fafc; font-family: -apple-system, sans-serif; font-size: 18px; font-weight: bold; }
    .subtitle { fill: #94a3b8; font-family: monospace; font-size: 12px; }
    .block-header { fill: #f8fafc; font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .port-text { fill: #e2e8f0; font-family: monospace; font-size: 11px; }
    .pin-label { fill: #94a3b8; font-family: monospace; font-size: 10px; }
    .wire-label { fill: #38bdf8; font-family: monospace; font-size: 10px; font-weight: bold; }
    .ctrl-label { fill: #f43f5e; font-family: monospace; font-size: 10px; font-weight: bold; }
    .stage-div { stroke: #e2e8f0; stroke-width: 2; stroke-dasharray: 6,4; }
    .stage-title { fill: #fbbf24; font-family: sans-serif; font-size: 15px; font-weight: bold; }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
  </marker>
  <marker id="ctrl-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
  </marker>
  <marker id="clk-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
  </marker>
</defs>
<rect width="700" height="420" class="bg" rx="10" />
<text x="25" y="32" class="title">Pipeline Register IF/ID (pipeline_reg_if_id) RTL Schematic</text>
<text x="25" y="52" class="subtitle">NanoRISC-V-C2 Core - Dual 32-bit Stage Boundary Register with Flush to NOP</text>
<line x1="50" y1="140" x2="160" y2="140" class="bus-wire" marker-end="url(#arrow)" />
<text x="60" y="130" class="wire-label">pc_if[31:0] /32</text>
<line x1="50" y1="260" x2="160" y2="260" class="bus-wire" marker-end="url(#arrow)" />
<text x="60" y="250" class="wire-label">inst_if[31:0] /32</text>
<polygon points="160,230 190,245 190,295 160,310" class="block-mux" />
<text x="170" y="275" fill="#f8fafc" font-size="10">MUX</text>
<line x1="120" y1="285" x2="160" y2="285" class="bus-wire" marker-end="url(#arrow)" />
<text x="75" y="295" class="port-text">32'h13 (NOP)</text>
<line x1="175" y1="180" x2="175" y2="240" class="ctrl-wire" marker-end="url(#ctrl-arrow)" />
<text x="155" y="170" class="ctrl-label">flush</text>
<rect x="250" y="80" width="230" height="280" class="block-pc" />
<rect x="250" y="80" width="230" height="30" fill="#0284c7" rx="6" />
<text x="365" y="102" class="block-header">Pipeline Register (IF/ID)</text>
<rect x="270" y="120" width="190" height="60" fill="#0f172a" stroke="#38bdf8" rx="4" />
<text x="365" y="145" class="block-header">PC Register (pc_id)</text>
<line x1="160" y1="140" x2="270" y2="140" class="bus-wire" marker-end="url(#arrow)" />
<line x1="460" y1="140" x2="580" y2="140" class="bus-wire" marker-end="url(#arrow)" />
<text x="480" y="130" class="wire-label">pc_id[31:0] /32</text>
<rect x="270" y="240" width="190" height="60" fill="#0f172a" stroke="#38bdf8" rx="4" />
<text x="365" y="265" class="block-header">Inst Register (inst_id)</text>
<line x1="190" y1="270" x2="270" y2="270" class="bus-wire" marker-end="url(#arrow)" />
<line x1="460" y1="270" x2="580" y2="270" class="bus-wire" marker-end="url(#arrow)" />
<text x="480" y="260" class="wire-label">inst_id[31:0] /32</text>
<line x1="200" y1="330" x2="250" y2="330" class="clk-wire" marker-end="url(#clk-arrow)" />
<text x="210" y="322" fill="#22c55e" font-family="monospace" font-size="11">clk</text>
<line x1="365" y1="390" x2="365" y2="360" class="ctrl-wire" marker-end="url(#ctrl-arrow)" />
<text x="375" y="380" class="ctrl-label">rst</text>
</svg>